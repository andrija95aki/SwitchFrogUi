name: Build R36SX GNU runtimes

on:
  workflow_dispatch:
  push:
    branches: [r36sx-source-build]
    paths:
      - apps/video_player.c
      - apps/treevidplay/upstream_video_player.c
      - patches/r36sx-pcsx4all-runtime.patch
      - patches/r36sx-picoarch.patch
      - .github/workflows/build-r36sx-gnu.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_COMMIT: 21084ac2f11cd719fc6c1ce745538f3aae54a043
      PORT_COMMIT: 1ce1a307dd12d60c35fa946a23ecd54bb94336b4
      SDK_URL: https://github.com/game-de-it/sf3000/releases/download/sf3000_toolchain_v0.1/mipsel-buildroot-linux-gnu_sdk-buildroot.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Download and relocate the official SF3000 GNU SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sf3000-sdk"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/sf3000-sdk.tar.gz" "$SDK_URL"
          tar -xzf "$RUNNER_TEMP/sf3000-sdk.tar.gz" -C "$RUNNER_TEMP/sf3000-sdk"
          relocate="$(find "$RUNNER_TEMP/sf3000-sdk" -name relocate-sdk.sh -type f -print -quit)"
          test -n "$relocate"
          chmod +x "$relocate"
          "$relocate"
          gcc="$(find "$RUNNER_TEMP/sf3000-sdk" -path '*/bin/mips-mti-linux-gnu-gcc' -type f -print -quit)"
          test -x "$gcc"
          prefix="${gcc%gcc}"
          # The archive also contains internal multilib sysroots.  PCSX4ALL's
          # documented SDK sysroot is the relocated Buildroot target tree.
          dlfcn="$(find "$RUNNER_TEMP/sf3000-sdk" -path '*/mipsel-buildroot-linux-gnu/sysroot/usr/include/dlfcn.h' -type f -print -quit)"
          test -n "$dlfcn"
          sysroot="$(dirname "$(dirname "$(dirname "$dlfcn")")")"
          test -d "$sysroot"
          echo "SF_GCC=$gcc" >> "$GITHUB_ENV"
          echo "SF_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "SF_SYSROOT=$sysroot" >> "$GITHUB_ENV"
          crt1="$($gcc -EL -print-file-name=crt1.o)"
          test -f "$crt1"
          echo "SF_CRT_DIR=$(dirname "$crt1")" >> "$GITHUB_ENV"

      - name: Assemble the pinned PCSX4ALL source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/gameblabla/pcsx4all.git "$RUNNER_TEMP/pcsx4all"
          git -C "$RUNNER_TEMP/pcsx4all" checkout "$BASE_COMMIT"
          git clone --filter=blob:none https://github.com/tzubertowski/TreeFrogUI_pcsx4all.git "$RUNNER_TEMP/pcsx-port"
          git -C "$RUNNER_TEMP/pcsx-port" checkout "$PORT_COMMIT"
          rsync -a --exclude=.git/ "$RUNNER_TEMP/pcsx-port/" "$RUNNER_TEMP/pcsx4all/"
          cp "$GITHUB_WORKSPACE/patches/pcsx4all/tf_driver.h" \
            "$RUNNER_TEMP/pcsx4all/src/port/sf3000/tf_driver.h"
          git -C "$RUNNER_TEMP/pcsx4all" apply "$GITHUB_WORKSPACE/patches/r36sx-pcsx4all-runtime.patch"

      - name: Assemble the pinned PicoArch source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --recurse-submodules \
            https://github.com/tzubertowski/TreeFrogUI_picoarch.git "$RUNNER_TEMP/picoarch"
          git -C "$RUNNER_TEMP/picoarch" checkout f8ff5ba
          git -C "$RUNNER_TEMP/picoarch" apply "$GITHUB_WORKSPACE/patches/r36sx-picoarch.patch"
          cp "$GITHUB_WORKSPACE/toolchain/mips_syscalls.S" "$RUNNER_TEMP/picoarch/mips_syscalls.S"

      - name: Build the pinned target libpng dependency
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/libpng-1.6.37.tar.gz" \
            https://github.com/glennrp/libpng/archive/refs/tags/v1.6.37.tar.gz
          tar -xzf "$RUNNER_TEMP/libpng-1.6.37.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/libpng-1.6.37"
          cp scripts/pnglibconf.h.prebuilt pnglibconf.h
          mkdir -p target-objects target-lib
          sources=(png.c pngerror.c pngget.c pngmem.c pngpread.c pngread.c pngrio.c \
            pngrtran.c pngrutil.c pngset.c pngtrans.c pngwio.c pngwrite.c pngwtran.c pngwutil.c)
          for source in "${sources[@]}"; do
            "$SF_GCC" -EL --sysroot="$SF_SYSROOT" -O2 -mips32r2 -mhard-float -mfp32 \
              -I. -I"$SF_SYSROOT/usr/include" -c "$source" \
              -o "target-objects/${source%.c}.o"
          done
          "${SF_PREFIX}ar" rcs target-lib/libpng12.a target-objects/*.o
          # PicoArch's historical Makefile requests -lpng12. Its readpng code
          # is already compatible with 1.6 (the local Zig build uses 1.6.37),
          # so provide the expected archive name without adding a card runtime
          # dependency.
          echo "SF_PNG_INCLUDE=$RUNNER_TEMP/libpng-1.6.37" >> "$GITHUB_ENV"
          echo "SF_PNG_LIB=$RUNNER_TEMP/libpng-1.6.37/target-lib" >> "$GITHUB_ENV"

      - name: Build merged GNU video player, PicoArch and PCSX4ALL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          "$SF_GCC" -mips32r2 -march=mips32r2 -mtune=24kc -mhard-float -mfp32 \
            -mlong-calls -G0 -EL --sysroot="$SF_SYSROOT" -O2 -DNDEBUG \
            -I"$SF_SYSROOT/usr/include" apps/video_player.c \
            "$RUNNER_TEMP/pcsx4all/src/port/sf3000/fonts.c" \
            -L"$SF_SYSROOT/usr/lib" -Wl,--gc-sections -s \
            -lffplayer -ljpeg -lpthread -o artifacts/video_player
          make -C "$RUNNER_TEMP/picoarch" -j2 platform=sf3000 \
            CROSS_COMPILE="$SF_PREFIX" SYSROOT="$SF_SYSROOT" \
            EXTRA_CFLAGS="-I$SF_SYSROOT/usr/include -I$SF_PNG_INCLUDE" \
            EXTRA_LDFLAGS="--sysroot=$SF_SYSROOT -B$SF_CRT_DIR -L$SF_PNG_LIB -L$SF_SYSROOT/usr/lib -Wl,-rpath-link,$SF_SYSROOT/usr/lib" picoarch
          cp "$RUNNER_TEMP/picoarch/picoarch" artifacts/picoarch
          make -C "$RUNNER_TEMP/picoarch" -j2 platform=sf3000 \
            CROSS_COMPILE="$SF_PREFIX" SYSROOT="$SF_SYSROOT" BIN=picoarch_hi \
            EXTRA_CFLAGS="-I$SF_SYSROOT/usr/include -I$SF_PNG_INCLUDE" \
            EXTRA_LDFLAGS="--sysroot=$SF_SYSROOT -B$SF_CRT_DIR -L$SF_PNG_LIB -L$SF_SYSROOT/usr/lib -Wl,-rpath-link,$SF_SYSROOT/usr/lib -Wl,-Ttext-segment=0x20000000" picoarch_hi
          cp "$RUNNER_TEMP/picoarch/picoarch_hi" artifacts/picoarch_hi
          make -C "$RUNNER_TEMP/pcsx4all" -f Makefile.sf3000 -j2 \
            TOOLCHAIN="$SF_PREFIX" SYSROOT="$SF_SYSROOT"
          cp "$RUNNER_TEMP/pcsx4all/pcsx4all" artifacts/pcsx4all
          file artifacts/video_player artifacts/picoarch artifacts/picoarch_hi artifacts/pcsx4all
          sha256sum artifacts/video_player artifacts/picoarch artifacts/picoarch_hi artifacts/pcsx4all > artifacts/SHA256SUMS.txt

      - name: Upload runtime binaries
        uses: actions/upload-artifact@v4
        with:
          name: switchfrogui-r36sx-gnu-runtimes
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
